<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>资料库</title><style>
:root{--bg:#fafafa;--card:#ffffff;--line:#ececec;--text:#333333;--title:#4a4058;--sub:#9b93a8;--muted:#c4bdd0;--accent:#b8a3e8;--accent-2:#a98fdc;--accent-soft:#f4effc;--accent-soft-2:#faf7fd;--accent-deep:#a98fdc;--pink:#f7d9e8;--pink-soft:#fdf3f8;--radius-lg:22px;--radius-md:16px;--radius-sm:14px;--shadow:0 1px 2px rgba(160,140,200,.04),0 4px 14px rgba(160,140,200,.06);--shadow-soft:0 1px 2px rgba(160,140,200,.04),0 3px 10px rgba(160,140,200,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;--accent-soft-2:color-mix(in srgb,var(--accent) 12%,#fff);--accent-deep:color-mix(in srgb,var(--accent) 72%,#000);--accent-glow:color-mix(in srgb,var(--accent) 22%,transparent)}
@supports not (color:color-mix(in srgb,red,blue)){body{--accent-soft-2:#faf7fd;--accent-deep:#a98fdc;--accent-glow:rgba(184,163,232,.2)}}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(circle at 20% 10%,var(--accent-glow) 0,transparent 18%),radial-gradient(circle at 82% 22%,var(--accent-glow) 0,transparent 16%)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:24px 18px 70px}
.top{padding:6px 4px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top .tt{flex:1;min-width:0}
.top h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.4px;color:var(--title);font-family:Georgia,"Songti SC",serif}
.top .en{display:block;font-size:10.5px;letter-spacing:3.5px;color:var(--accent-deep);font-weight:600;margin-bottom:6px;text-transform:uppercase;opacity:.75}
.top p{margin:0;font-size:13px;color:var(--sub)}
.top .gear{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .18s}
.top .gear:active{transform:scale(.94)}
.top .gear svg{width:19px;height:19px;color:var(--accent-deep)}
.shelf{position:relative;margin-bottom:18px;min-height:340px}
.book{position:relative;width:70%;min-height:420px;z-index:1;border-radius:6px 18px 18px 6px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));box-shadow:0 12px 30px rgba(120,100,160,.18),inset -1px 0 0 rgba(255,255,255,.15),inset -10px 0 20px -10px rgba(0,0,0,.15);overflow:visible;cursor:pointer;transition:transform .2s}
.book:active{transform:scale(.99)}
.book .book-cover{position:absolute;inset:0;border-radius:6px 18px 18px 6px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.18),rgba(255,255,255,.02))}
.book .book-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.book .book-spine{position:absolute;left:0;top:0;bottom:0;width:14px;border-radius:6px 0 0 6px;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0));pointer-events:none}
.book .book-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:12.5px;font-weight:600;padding:20px;line-height:1.9;text-shadow:0 1px 3px rgba(0,0,0,.15)}
.book .book-edit{position:absolute;bottom:10px;right:10px;z-index:3;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.5);border-radius:9px;font-size:11px;color:#fff;padding:4px 9px;cursor:pointer;font-weight:600;font-family:inherit;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:.7;transition:opacity .2s}
.book .book-edit:active{opacity:1}
.bookmarks{position:absolute;left:calc(70% - 8px);top:32px;bottom:32px;right:0;display:flex;flex-direction:column;justify-content:space-between;padding-left:0;z-index:0;pointer-events:none}
.bm{position:relative;pointer-events:auto;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.6);border-radius:0 999px 999px 0;padding:0 16px 0 10px;height:44px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:transform .18s,box-shadow .2s;backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);box-shadow:0 2px 8px rgba(120,100,160,.12),inset 0 1px 0 rgba(255,255,255,.7);color:var(--accent-deep);overflow:hidden}
.bm::before{content:"";position:absolute;left:-8px;top:0;bottom:0;width:14px;background:linear-gradient(90deg,rgba(0,0,0,.06),transparent);pointer-events:none}
.bm:active{transform:scale(.97)}
.bm .bm-ico{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(255,255,255,.5);overflow:hidden;color:var(--accent-deep)}
.bm .bm-ico svg{width:15px;height:15px}
.bm .bm-ico img{width:100%;height:100%;object-fit:cover;display:block}
.bm .bm-name{flex:1;min-width:0;font-size:13px;font-weight:700;color:var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm .bm-num{font-size:11.5px;color:var(--accent-deep);opacity:.5;font-weight:700;flex-shrink:0;letter-spacing:.3px}
.bm.fill{padding:0}
.bm.fill .bm-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.bm.fill .bm-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.75) 0%,rgba(255,255,255,.25) 55%,rgba(255,255,255,0) 100%);z-index:1}
.bm.fill .bm-ico{display:none}
.bm.fill .bm-name,.bm.fill .bm-num{position:relative;z-index:2;padding-left:14px}
.home-quote{margin-top:16px;text-align:center;font-size:12.5px;color:var(--sub);font-weight:500;letter-spacing:.3px;padding:14px 10px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line)}
.home-quote::before{content:"❀ ";color:var(--accent);opacity:.7}
.home-quote::after{content:" ❀";color:var(--accent);opacity:.7}.head{display:flex;align-items:center;gap:10px;padding:4px 4px 18px}
.back{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:var(--shadow-soft);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:transform .15s}
.back:active{transform:scale(.94)}
.back svg{width:18px;height:18px;color:var(--accent-deep)}
.head h2{margin:0;font-size:19px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--title);font-family:Georgia,"Songti SC",serif;letter-spacing:.2px}
.head .act{display:flex;gap:8px;flex-shrink:0}
.btn{border:1px solid rgba(255,255,255,.6);font-family:inherit;font-size:13.5px;font-weight:600;padding:10px 16px;border-radius:var(--radius-sm);cursor:pointer;transition:background .18s,transform .12s,box-shadow .2s;background:rgba(255,255,255,.45);backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);color:var(--accent-deep);box-shadow:0 2px 8px rgba(0,0,0,.03),inset 0 1px 0 rgba(255,255,255,.7)}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,rgba(255,255,255,.25),rgba(255,255,255,.05)),linear-gradient(135deg,var(--accent),var(--accent-deep));border:1px solid rgba(255,255,255,.35);color:#fff;backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);box-shadow:0 4px 12px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid transparent;padding:9px 12px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.btn.danger{background:rgba(255,255,255,.45);color:#c47a9c;border:1px solid rgba(255,255,255,.6)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-soft);display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .18s,box-shadow .2s}
.item:active{transform:scale(.99)}
.item .info{flex:1;min-width:0}
.item .info h4{margin:0 0 4px;font-size:15px;font-weight:700;color:var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .info p{margin:0;font-size:12.5px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mini{display:flex;gap:6px;flex-shrink:0}
.mini-btn{width:34px;height:34px;border-radius:11px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.45);backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s,background .2s;color:#c47a9c}
.mini-btn svg{width:16px;height:16px}
.form{display:flex;flex-direction:column;gap:14px}
.field{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow-soft)}
.field-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;cursor:pointer;user-select:none}
.field-head .name{font-size:12.5px;font-weight:700;color:var(--accent-deep);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.3px}
.field-head .arrow{font-size:11px;color:var(--muted);transition:transform .25s}
.field.folded .field-head .arrow{transform:rotate(-90deg)}
.field.folded .field-body{display:none}
.field-body{position:relative}
.input,.area{width:100%;background:var(--accent-soft-2);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;font-size:14px;font-family:inherit;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;resize:vertical}
.input:focus,.area:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fff}
.input::placeholder,.area::placeholder{color:var(--muted)}
.area{min-height:100px;line-height:1.7}
.area.tall{min-height:200px}
.area.locked{background:var(--accent-soft);color:var(--sub)}
.btnbar{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.btnbar .b{font-size:12px;padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.45);backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);color:var(--accent-deep);border:1px solid rgba(255,255,255,.6);cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.btnbar .b.done{background:#e7f4ee;color:#5a9c7c;border-color:#cfe8dd}
.btnbar .b.loading{background:var(--accent-soft);color:var(--accent-deep)}
.btnbar .b.danger{background:rgba(255,255,255,.45);color:#c47a9c}
.transbox{margin-top:12px;background:var(--accent-soft-2);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px}
.transbox .tlabel{font-size:11px;color:var(--accent-deep);font-weight:700;margin-bottom:6px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;letter-spacing:.5px}
.transbox .tcontent{font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.transbox .tcontent.muted{color:var(--sub)}
.transbox .tcontent.err{color:#c47a9c}
.attach{display:flex;gap:12px}
.attach-item{flex:1;border:1.5px dashed var(--line);border-radius:var(--radius-md);padding:16px;text-align:center;color:var(--sub);font-size:12.5px;cursor:pointer;background:var(--accent-soft-2);transition:background .2s,border-color .2s}
.attach-item:active{background:var(--accent-soft);border-color:var(--accent)}
.attach-item .thumb{width:100%;max-height:180px;object-fit:contain;border-radius:12px;margin-bottom:8px;display:block;background:transparent}
.attach-item .rm{margin-top:6px;font-size:11.5px;color:#c47a9c;background:transparent;border:none;cursor:pointer;font-family:inherit}
.row-btns{display:flex;gap:10px;margin-top:10px}
.row-btns .btn{flex:1;padding:13px;font-size:14px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 0}
.empty::before{content:"✿";display:block;font-size:20px;color:var(--accent);opacity:.5;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;padding:11px 22px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:999;max-width:80vw;text-align:center;box-shadow:0 8px 24px var(--accent-glow);font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kcard{background:var(--accent-soft-2);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px;margin-bottom:10px}
.kcard .kname{width:100%;background:transparent;border:none;font-size:13.5px;font-weight:700;color:var(--text);font-family:inherit;outline:none;padding:2px 0}
.kcard .krow{display:flex;gap:8px;align-items:center;margin-top:8px}
.kcard .kval{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;font-family:inherit;color:var(--text);outline:none}
.setting-row{display:flex;gap:8px;align-items:stretch}
.setting-row .input{flex:1}
.setting-row .btn{flex-shrink:0;white-space:nowrap}
.model-list{margin-top:10px;background:var(--accent-soft-2);border:1px solid var(--line);border-radius:var(--radius-md);max-height:220px;overflow:auto}
.model-list .m-item{padding:11px 14px;font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line)}
.model-list .m-item:last-child{border-bottom:none}
.model-list .m-item.on{color:var(--accent-deep);font-weight:700;background:var(--accent-soft)}
.font-row{display:flex;align-items:center;padding:11px 13px;background:var(--accent-soft-2);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;font-size:13.5px;cursor:pointer;transition:all .18s}
.font-row.on{border-color:var(--accent);background:var(--accent-soft)}
.font-del{font-size:12px;padding:4px 10px;border-radius:8px;background:var(--pink-soft);color:#c47a9c;border:1px solid transparent;cursor:pointer;font-family:inherit;font-weight:600}
.bm-set{background:var(--accent-soft-2);border:1px solid var(--line);border-radius:var(--radius-md);padding:12px;margin-bottom:10px}
.bm-set-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.bm-set-head .bm-set-name{flex:1;font-size:13px;font-weight:700;color:var(--text)}
.bm-set-head .bm-set-arrow{font-size:11px;color:var(--muted);transition:transform .25s}
.bm-set.folded .bm-set-head .bm-set-arrow{transform:rotate(-90deg)}
.bm-set.folded .bm-set-body{display:none}
.bm-set-body{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.bm-modes{display:flex;gap:6px;flex-wrap:wrap}
.bm-modes label{font-size:12px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;font-weight:600;transition:all .15s}
.bm-modes label.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-deep)}
.bm-modes input{display:none}
.bm-img-row{display:flex;gap:8px;align-items:center}
.bm-img-preview{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;object-fit:cover;flex-shrink:0}
.bm-img-row .btn{font-size:12px;padding:7px 12px}
.theme-swatch{width:52px;height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.6);cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex-shrink:0;padding:0;background-clip:padding-box}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.wrap>.shelf,.wrap>.list,.wrap>.form{animation:fadeIn .3s ease}
.ai-modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.ai-modal.show{display:flex}
.ai-box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.ai-box h3{margin:0 0 12px;font-size:16px;font-weight:700;color:var(--title)}
.ai-box p{margin:0 0 14px;font-size:13px;color:var(--sub);line-height:1.6}
.ai-box .ai-input{width:100%;background:var(--accent-soft-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;font-family:inherit;color:var(--text);outline:none;resize:vertical;min-height:80px;line-height:1.6}
.ai-box .ai-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ai-box .ai-tips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ai-box .ai-tips button{font-size:12px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;font-family:inherit;font-weight:600}
.ai-box .ai-tips button:active{background:var(--accent-soft);color:var(--accent-deep);border-color:var(--accent)}
.ai-box .ai-actions{display:flex;gap:10px;margin-top:16px}
.ai-box .ai-actions .btn{flex:1;padding:12px;font-size:14px}
.ai-progress{display:none;margin-top:14px}
.ai-progress.show{display:block}
.ai-progress .bar-bg{width:100%;height:8px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.ai-progress .bar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-deep));transition:width .3s ease}
.ai-progress .pct{font-size:12px;color:var(--sub);text-align:right;margin-top:6px;font-weight:600}
.ai-progress .msg{font-size:12.5px;color:var(--sub);margin-top:6px;text-align:center}
.ai-result{margin-top:12px;background:var(--accent-soft-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.ai-result .head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;margin-bottom:8px}
.ai-result .head .name{font-size:11.5px;color:var(--accent-deep);font-weight:700;flex:1;letter-spacing:.3px}
.ai-result .head .arrow{font-size:11px;color:var(--muted);transition:transform .25s}
.ai-result.folded .head .arrow{transform:rotate(-90deg)}
.ai-result.folded .body{display:none}
.ai-result .body{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--text);max-height:240px;overflow:auto;padding:8px 0 0}
.ai-result .barbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.ai-result .barbtns button{font-size:12px;padding:5px 10px;border-radius:9px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);color:var(--accent-deep);cursor:pointer;font-family:inherit;font-weight:600}
.ai-result .barbtns button.danger{color:#c47a9c}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tab{flex:1;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 2px 8px rgba(120,100,160,.08);transition:all .2s}
.tab:active{transform:scale(.97)}
.tab.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 4px 14px var(--accent-glow)}
.tab .t-ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.6);color:var(--accent-deep);flex-shrink:0}
.tab .t-ico svg{width:18px;height:18px}
.tab .t-name{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--title)}
.tab .t-num{font-size:11.5px;color:var(--accent-deep);opacity:.5;font-weight:700}
.card-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:12px;box-shadow:var(--shadow-soft);display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .18s}
.card-item:active{transform:scale(.99)}
.card-item img{width:52px;height:52px;border-radius:14px;object-fit:cover;flex-shrink:0;background:var(--accent-soft)}
.card-item .c-info{flex:1;min-width:0}
.card-item .c-info h4{margin:0 0 4px;font-size:14.5px;font-weight:700;color:var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-item .c-info p{margin:0;font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>/* ---------- IndexedDB ---------- */
const IDB_NAME='my_db_idb';const IDB_VER=1;let __idb=null;
function openIDB(){return new Promise((resolve,reject)=>{if(__idb)return resolve(__idb);const req=indexedDB.open(IDB_NAME,IDB_VER);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv')};req.onsuccess=()=>{__idb=req.result;resolve(__idb)};req.onerror=()=>reject(req.error)})}
async function idbGet(key){try{const db=await openIDB();return new Promise((res,rej)=>{const r=db.transaction('kv','readonly').objectStore('kv').get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){return null}}
async function idbSet(key,val){try{const db=await openIDB();return new Promise((res,rej)=>{const r=db.transaction('kv','readwrite').objectStore('kv').put(val,key);r.onsuccess=()=>res(true);r.onerror=()=>rej(r.error)})}catch(e){return false}}
const __cache={data:null,settings:null,trans:null,fold:'0'};
function persist(k){idbSet('kv_'+k,__cache[k]).catch(()=>{})}
function save(){__cache.data=data;persist('data')}
function saveSettings(){__cache.settings=settings;persist('settings')}
function saveTrans(){__cache.trans=transState;persist('trans')}
function saveFold(){__cache.fold=transFold?'1':'0';persist('fold')}
const STORE_KEY='my_db_v4';
function uid(){return Math.random().toString(36).slice(2,10)}
const defaultData={api:[],persona:[],world:[],artist:[],emoji:[],plugin:[],stcards:[]};
const defaultSettings={apiBase:'',apiKey:'',model:'',fontUrl:'',fontData:'',fonts:[],fontCurrent:-1,cover:'',bm:{},theme:'',textColor:'',titleColor:'',bmFold:{}};
let data=structuredClone(defaultData);
let settings=Object.assign({},defaultSettings);
let transState={};let transFold=false;
let view={level:'home',category:null,itemId:null,sub:''};
function migratePersona(p){if(p&&p.fields)return p;const id=p.id||uid();return{id,title:p&&(p.title||'')||'',raw:p&&(p.content||'')||'',fields:[]}}
function applyTheme(){const c=settings.theme||'#b8a3e8';document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--accent-2',c);document.documentElement.style.setProperty('--text',settings.textColor||'#333333');document.documentElement.style.setProperty('--title',settings.titleColor||'#4a4058')}
async function boot(){const d=await idbGet('kv_data');const s=await idbGet('kv_settings');const t=await idbGet('kv_trans');const f=await idbGet('kv_fold');
let dd=d;if(!dd){try{const old=localStorage.getItem(STORE_KEY);if(old)dd=JSON.parse(old)}catch(e){}}
data=dd||structuredClone(defaultData);
['api','persona','world','artist','emoji','plugin','stcards'].forEach(k=>{if(!data[k])data[k]=[]});
data.persona=(data.persona||[]).map(migratePersona);
settings=Object.assign({},defaultSettings,s||{});
if(!Array.isArray(settings.fonts))settings.fonts=[];
if(typeof settings.fontCurrent!=='number')settings.fontCurrent=-1;
if(!settings.bm||typeof settings.bm!=='object')settings.bm={};
if(!settings.bmFold||typeof settings.bmFold!=='object')settings.bmFold={};
if(!settings.theme)settings.theme='';
if(!settings.textColor)settings.textColor='';
if(!settings.titleColor)settings.titleColor='';
transState=t||{};
transFold=f==='1';
__cache.data=data;__cache.settings=settings;__cache.trans=transState;__cache.fold=transFold?'1':'0';
applyTheme();
if(!d&&dd)persist('data');
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2200)}
async function copyText(text,btn){try{await navigator.clipboard.writeText(text||'');if(btn){btn.classList.add('done');const o=btn.textContent;btn.textContent='已复制';setTimeout(()=>{btn.classList.remove('done');btn.textContent=o},1200)}else toast('已复制')}catch(e){toast('复制失败')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pickFile(accept,onLoad){const i=document.createElement('input');i.type='file';i.accept=accept;i.onchange=()=>{const f=i.files[0];if(f)onLoad(f)};i.click()}
function readAsText(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f,'UTF-8')})}
function readAsArrayBuffer(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsArrayBuffer(f)})}
function readAsDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function readDocx(f){const b=await readAsArrayBuffer(f);const r=await mammoth.extractRawText({arrayBuffer:b});return r.value||''}
function titleFromFile(f){return f.name.replace(/\.[^.]+$/,'')}
async function parseSTCard(file){const buf=await readAsArrayBuffer(file);const u8=new Uint8Array(buf);const dv=new DataView(buf);let off=8;let chara='';let ccv3='';while(off<u8.length){const len=dv.getUint32(off,false);const type=new TextDecoder('ascii').decode(u8.subarray(off+4,off+8));if(type==='tEXt'){const data=u8.subarray(off+8,off+8+len);const zero=data.indexOf(0);if(zero>=0){const key=new TextDecoder('ascii').decode(data.subarray(0,zero));const val=new TextDecoder('utf-8').decode(data.subarray(zero+1));if(key==='chara')chara=val;else if(key==='ccv3')ccv3=val}}else if(type==='IEND'){break}off+=12+len}let json=null;const raw=ccv3||chara;if(raw){try{const bin=atob(raw);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);json=JSON.parse(new TextDecoder('utf-8').decode(bytes))}catch(e){try{json=JSON.parse(raw)}catch(e2){json=null}}}const img=await readAsDataURL(file);const name=(json&&(json.name||(json.data&&json.data.name)))||file.name.replace(/\.[^.]+$/,'');const intro=(json&&(json.description||(json.data&&json.data.description)||json.personality||(json.data&&json.data.personality)))||'';return{name,intro,img,json}}
async function parseImport(cat,file){const title=titleFromFile(file);const ext=(file.name.split('.').pop()||'').toLowerCase();if(ext==='docx'){return{title,content:await readDocxSafe(file)}}if(ext==='doc')throw new Error('请另存为 .docx 或 .txt');if(ext==='json'){const text=await readAsText(file);let j;try{j=JSON.parse(text)}catch(e){throw new Error('JSON 解析失败')}if(cat==='emoji')return{title,emoji:j};return normalizeJson(cat,j,title)}return{title,content:await readAsText(file)}}
async function readDocxSafe(file){if(typeof mammoth!=='undefined'){try{const t=await readDocx(file);if(t&&t.trim())return t}catch(e){}}try{return await readDocxByXml(file)}catch(e){throw new Error('DOCX 解析失败，请另存为 .txt')}}
async function readDocxByXml(file){const buf=await readAsArrayBuffer(file);const zip=await unzipDocx(buf);const xml=zip['word/document.xml'];if(!xml)throw new Error('no document.xml');const w=xml.replace(/<w:p[^>]*>/g,'\n').replace(/<w:br[^>]*\/>/g,'\n').replace(/<[^>]+>/g,'');return w.replace(/\n{3,}/g,'\n\n').trim()}
async function unzipDocx(ab){const u8=new Uint8Array(ab);const dv=new DataView(ab);const files={};let eocd=-1;for(let i=u8.length-22;i>=0&&i>=u8.length-66000;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}if(eocd<0)throw new Error('no zip');const cdOff=dv.getUint32(eocd+16,true);const cdCnt=dv.getUint16(eocd+10,true);let p=cdOff;for(let n=0;n<cdCnt;n++){if(dv.getUint32(p,true)!==0x02014b50)break;const method=dv.getUint16(p+10,true);const compSize=dv.getUint32(p+20,true);const nameLen=dv.getUint16(p+28,true);const extraLen=dv.getUint16(p+30,true);const cmtLen=dv.getUint16(p+32,true);const lo=dv.getUint32(p+42,true);const name=new TextDecoder('utf-8').decode(u8.subarray(p+46,p+46+nameLen));if(name==='word/document.xml'){const lhN=dv.getUint16(lo+26,true);const lhE=dv.getUint16(lo+28,true);const ds=lo+30+lhN+lhE;const comp=u8.subarray(ds,ds+compSize);let raw;if(method===0)raw=comp;else if(method===8)raw=await inflateRaw(comp);else throw new Error('zip method');files[name]=new TextDecoder('utf-8').decode(raw);break}p+=46+nameLen+extraLen+cmtLen}return files}
async function inflateRaw(u8){if(typeof DecompressionStream==='undefined')throw new Error('need DecompressionStream');const ds=new DecompressionStream('deflate-raw');const st=new Blob([u8]).stream().pipeThrough(ds);const ab=await new Response(st).arrayBuffer();return new Uint8Array(ab)}
function normalizeJson(cat,json,title){if(json&&json.entries&&typeof json.entries==='object'){const arr=Object.values(json.entries).sort((a,b)=>(a.displayIndex||0)-(b.displayIndex||0));if(arr.length)return{multi:arr.map(e=>({title:e.comment||'(无标题)',content:e.content||''}))}}if(Array.isArray(json))return{multi:json.map(j=>normalizeJson(cat,j,title))};if(cat==='world'||cat==='persona')return{title,content:json.content||json.内容||json.text||JSON.stringify(json,null,2)};if(cat==='artist')return{title,positive:json.positive||json.正面||json.正||'',negative:json.negative||json.负面||json.负||''};if(cat==='api')return{title,url:json.url||json.URL||'',keys:json.keys||json.密钥||[{name:'主密钥',value:''}]};if(cat==='plugin')return{title,items:json.items||json.条目||[{type:'',url:''}]};return{title,content:JSON.stringify(json,null,2)}}
async function importTo(cat){const accept='.txt,.json,.docx';pickFile(accept,async f=>{try{const p=await parseImport(cat,f);addImported(cat,p)}catch(e){toast('导入失败：'+(e&&e.message?e.message:'未知错误'))}})}
function addImported(cat,parsed){if(cat==='emoji'){let lines=[];if(parsed.emoji&&Array.isArray(parsed.emoji)){lines=parsed.emoji.map(o=>{const m=o.meaning||o.name||o.title||'';const u=o.url||o.link||o.src||'';return m+'：'+u}).filter(Boolean)}else if(parsed.content){lines=parsed.content.split(/\r?\n/).map(l=>l.trim()).filter(Boolean)}const it=blankItem('emoji');it.title=parsed.title;it.content=lines.join('\n');data.emoji.push(it);save();toast('已导入 '+lines.length+' 行');view={level:'edit',category:'emoji',itemId:it.id};render();return}
if(parsed.multi){parsed.multi.forEach(p=>{if(cat==='persona'){const it=blankPersona();it.title=p.title;it.raw=p.content||'';it.fields=autoSplitFields(p.content||'');data.persona.push(it)}else if(cat==='plugin'){const it=blankItem('plugin');it.title=p.title;it.items=p.items||[{type:'',url:''}];data.plugin.push(it)}else{const it=blankItem(cat);if(cat==='api'){it.name=p.title;it.url=p.url||'';it.keys=p.keys||[{name:'主密钥',value:''}]}else{it.title=p.title;it.content=p.content||''}data[cat].push(it)}});save();toast('已导入 '+parsed.multi.length+' 条');view={level:'list',category:cat,itemId:null,sub:''};render();return}
if(cat==='api'){const sites=parseApiText(parsed.content||'');if(sites.length){sites.forEach(s=>{const it=blankItem('api');it.name=s.name;it.url=s.url;it.keys=s.keys;data.api.push(it)});save();toast('已导入 '+sites.length+' 个站点');view={level:'home',category:null,itemId:null,sub:''};render();return}}
if(cat==='persona'){const it=blankPersona();it.title=parsed.title;it.raw=parsed.content||'';it.fields=autoSplitFields(parsed.content||'');data.persona.push(it);save();toast('导入成功');view={level:'edit',category:'persona',itemId:it.id};render();return}
if(cat==='plugin'){const it=blankItem('plugin');it.title=parsed.title;it.items=[{type:'',url:parsed.content||''}];data.plugin.push(it);save();toast('导入成功');view={level:'edit',category:'plugin',itemId:it.id};render();return}
const item=blankItem(cat);if(cat==='world'){item.title=parsed.title;item.content=parsed.content||''}else if(cat==='artist'){item.title=parsed.title;const s=splitArtistText(parsed.positive||parsed.content||'');item.positive=parsed.positive||s.positive;item.negative=parsed.negative||s.negative}else if(cat==='api'){item.name=parsed.title;item.url=parsed.url||'';item.keys=parsed.keys||[{name:'主密钥',value:''}]}data[cat].push(item);save();toast('导入成功');view={level:'edit',category:cat,itemId:item.id};render()}function autoSplitFields(text){const names=['简介','经历','相处模式','用语习惯','外貌','性格','喜好','口癖','背景','说话风格','称呼','设定','备注'];const out=[];if(!text)return out;for(const n of names){const re=new RegExp('(?:^|\\n)\\s*[#\\-*\\d\\.\\s]*'+n+'\\s*[:：]\\s*([\\s\\S]*?)(?=\\n\\s*[#\\-*\\d\\.\\s]*(?:'+names.join('|')+')\\s*[:：]|$)');const m=text.match(re);if(m&&m[1].trim())out.push({name:n,value:m[1].trim()})}return out}
function parseApiText(text){if(!text)return[];const blocks=text.replace(/\r/g,'').split(/\n(?=\s*站点\s*[:：])/);const sites=[];blocks.forEach(b=>{const m=b.match(/站点\s*[:：]\s*(.+)/);if(!m)return;const name=m[1].trim();const urlM=b.match(/(?:API\s*地址|API地址|接口地址)\s*[:：]\s*(\S+)/)||b.match(/(?:主网站|主站|网站)\s*[:：]\s*(\S+)/);const url=urlM?urlM[1].trim():'';const keys=[];const lines=b.split('\n').map(l=>l.trim()).filter(Boolean);for(let i=0;i<lines.length;i++){const km=lines[i].match(/^密钥\s*[:：]\s*(.+)$/);if(km){const kn=km[1].trim();let kv='';for(let j=i+1;j<lines.length;j++){const nx=lines[j];if(/^密钥\s*[:：]/.test(nx)||/^站点\s*[:：]/.test(nx))break;kv=nx;break}keys.push({name:kn,value:kv})}}if(!keys.length)keys.push({name:'主密钥',value:''});sites.push({name,url,keys})});return sites}
function splitArtistText(text){if(!text)return{positive:'',negative:''};const p=text.match(/(?:正面提示词|正面|正)\s*[:：]\s*([\s\S]*?)(?=(?:负面提示词|负面|负)\s*[:：]|$)/);const n=text.match(/(?:负面提示词|负面|负)\s*[:：]\s*([\s\S]*?)(?=(?:正面提示词|正面|正)\s*[:：]|$)/);if(p||n)return{positive:p?p[1].trim():'',negative:n?n[1].trim():''};return{positive:text.trim(),negative:''}}
async function translate(text){if(!settings.apiBase||!settings.apiKey||!settings.model)throw new Error('请先在设置里配置 API');const url=settings.apiBase.replace(/\/+$/,'')+'/chat/completions';const body={model:settings.model,messages:[{role:'system',content:'你是翻译助手。将用户发来的内容翻译为中文。如果内容已经是中文，翻译为英文。只输出翻译结果，不要任何解释。保留原有换行格式。'},{role:'user',content:text}],temperature:0.2};const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey},body:JSON.stringify(body)});if(!r.ok)throw new Error('API 错误 '+r.status);const j=await r.json();const out=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(!out)throw new Error('返回为空');return out.trim()}
async function aiSplitPersona(text){if(!settings.apiBase||!settings.apiKey||!settings.model)throw new Error('请先在设置里配置 API');const url=settings.apiBase.replace(/\/+$/,'')+'/chat/completions';const sys='你是人设结构化助手。把用户给的人设文本拆成若干段落，每个段落是「名称：内容」的形式。优先使用的名称有：简介、经历、相处模式、用语习惯；如果内容里有更贴切的其它分类，也可以使用。只输出 JSON，格式：{"字段名":"内容","字段名2":"内容2"}，不要任何解释、不要 markdown。保留原文换行。';const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey},body:JSON.stringify({model:settings.model,messages:[{role:'system',content:sys},{role:'user',content:text}],temperature:0.2})});if(!r.ok)throw new Error('API 错误 '+r.status);const j=await r.json();let out=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(!out)throw new Error('返回为空');out=out.trim().replace(/^```(json)?/,'').replace(/```$/,'').trim();let obj;try{obj=JSON.parse(out)}catch(e){const m=out.match(/\{[\s\S]*\}/);if(!m)throw new Error('AI 返回无法解析');obj=JSON.parse(m[0])}return Object.entries(obj).map(([k,v])=>({name:k,value:String(v||'').trim()})).filter(f=>f.value)}
async function aiFormatText(text,instruction){if(!settings.apiBase||!settings.apiKey||!settings.model)throw new Error('请先在设置里配置 API');const url=settings.apiBase.replace(/\/+$/,'')+'/chat/completions';const sys='你是格式整理助手。用户会给你一段表情包列表（每行一个：含义 + 链接）和一条指令。你按指令把整段重新整理，只输出整理后的结果，不要解释、不要 markdown、不要多余空行。保留每一条的含义和链接，顺序不变。';const user='指令：'+instruction+'\n\n原文：\n'+text;const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey},body:JSON.stringify({model:settings.model,messages:[{role:'system',content:sys},{role:'user',content:user}],temperature:0.2})});if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw new Error('API 错误 '+r.status+(t?'：'+t.slice(0,120):''))}const j=await r.json();const out=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;if(!out)throw new Error('返回为空');return out.trim()}
function aiResultHtml(key,idx,st){const folded=st.folded?' folded':'';const body=st.loading?`<div style="color:var(--sub);font-size:12.5px">AI 识别中…</div>`:st.error?`<div style="color:#c47a9c;font-size:12.5px">生成失败：${esc(st.error)}</div>`:`<div class="body">${esc(st.text||'')}</div>`;const btns=st.text&&!st.loading?`<div class="barbtns"><button data-copy-ai="${key}:${idx}">复制</button><button class="danger" data-del-ai="${key}:${idx}">删除</button></div>`:`<div class="barbtns"><button class="danger" data-del-ai="${key}:${idx}">删除</button></div>`;return`<div class="ai-result${folded}"><div class="head" data-toggle-ai="${key}:${idx}"><span class="name">识别结果 ${idx+1}</span><span class="arrow">▼</span></div>${body}${btns}</div>`}
async function fetchModels(){if(!settings.apiBase||!settings.apiKey)throw new Error('请先填 API 地址和密钥');const url=settings.apiBase.replace(/\/+$/,'')+'/models';const r=await fetch(url,{headers:{'Authorization':'Bearer '+settings.apiKey}});if(!r.ok)throw new Error('获取失败 '+r.status);const j=await r.json();const list=(j&&j.data||[]).map(m=>m.id).filter(Boolean);if(!list.length)throw new Error('未获取到模型');return list}
function applyFont(){const id='custom-font-style';let s=document.getElementById(id);if(!s){s=document.createElement('style');s.id=id;document.head.appendChild(s)}let src='';const cur=settings.fontCurrent;if(cur>=0&&settings.fonts&&settings.fonts[cur])src=settings.fonts[cur].data;else if(settings.fontUrl)src=settings.fontUrl;if(src){s.textContent='@font-face{font-family:MyCustomFont;src:url("'+src+'");} body,button,input,textarea{font-family:MyCustomFont,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif !important}'}else{s.textContent=''}}
const CATS={world:{icon:'i-world',name:'世界书',desc:'设定、规则、条目'},artist:{icon:'i-artist',name:'画师串',desc:'正负面提示词'},api:{icon:'i-api',name:'密钥盒',desc:'站点与密钥'},plugin:{icon:'i-plugin',name:'插件屋',desc:'酒馆插件与链接'},persona:{icon:'i-persona',name:'人设馆',desc:'角色人设'},emoji:{icon:'i-emoji',name:'表情包',desc:'含义与链接'}};
function svg(id,cls){return`<svg class="${cls||''}" width="20" height="20"><use href="#${id}"/></svg>`}
function blankItem(k){const id=uid();if(k==='api')return{id,name:'',url:'',keys:[{name:'主密钥',value:''}]};if(k==='world')return{id,title:'',content:''};if(k==='emoji')return{id,title:'',content:'',img:''};if(k==='artist')return{id,title:'',img:'',positive:'',negative:''};if(k==='plugin')return{id,title:'',items:[{type:'',url:''}]}}
function blankPersona(){return{id:uid(),title:'',raw:'',fields:[]}}
function preview(k,it){if(k==='emoji'&&it.img)return'（含预览图）'+(it.content||'').replace(/\n/g,' ').slice(0,30);if(k==='api')return it.url||'未设置 URL';if(k==='artist')return(it.positive||'').slice(0,40)||'未填写提示词';if(k==='persona'){const f=(it.fields||[]).map(x=>x.name).join('、');return f?f:(it.raw||'').replace(/\n/g,' ').slice(0,40)}if(k==='plugin'){const n=(it.items||[]).length;return n?n+' 个链接':'还没有链接'}return(it.content||'').replace(/\n/g,' ').slice(0,40)||'暂无内容'}
function buildPersonaText(it){const parts=[];(it.fields||[]).forEach(f=>{if(f.value&&f.value.trim())parts.push(f.name+'：\n'+f.value.trim())});if(!parts.length&&it.raw)parts.push(it.raw.trim());return parts.join('\n\n')}
const QUOTES=['今天也要好好记录哦','把喜欢的东西都收进来吧','慢慢来，不着急','今天也是温柔的一天','愿你的灵感一直都在','记得喝口水呀','开心最重要啦','让自己舒服一点'];
function todayLine(){const d=new Date();return(d.getMonth()+1)+' 月 '+d.getDate()+' 日 · 星期'+'日一二三四五六'[d.getDay()]}
function bmOf(k){const b=settings.bm&&settings.bm[k];return b||{mode:'default',img:''}}

function viewHome(){const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];let cover=settings.cover?`<img src="${esc(settings.cover)}"><div class="book-edit">更换</div>`:`<div class="book-hint">点击上传<br>封面图片</div>`;let bmHtml=Object.entries(CATS).map(([k,m])=>{const b=bmOf(k);const num=(data[k]||[]).length;if(b.mode==='fill'&&b.img){return`<div class="bm fill" data-open-cat="${k}"><img class="bm-cover" src="${esc(b.img)}"><div class="bm-overlay"></div><div class="bm-name">${m.name}</div><div class="bm-num">${num}</div></div>`}const ico=b.mode==='icon'&&b.img?`<img src="${esc(b.img)}">`:svg(m.icon);return`<div class="bm" data-open-cat="${k}"><div class="bm-ico">${ico}</div><div class="bm-name">${m.name}</div><div class="bm-num">${num}</div></div>`}).join('');return`<div class="top"><div class="tt"><span class="en">My Little Studio</span><h1>资料库</h1><p>集中管理你的提示词、世界书与站点信息</p></div><div class="gear" data-open-settings>${svg('i-gear')}</div></div><div class="shelf"><div class="book" data-pick-cover><div class="book-cover">${cover}</div><div class="book-spine"></div></div><div class="bookmarks">${bmHtml}</div></div><div class="home-quote">${todayLine()} · ${q}</div>`}

function viewPersonaList(){const tab=(view.sub==='st')?'st':'doc';const docs=data.persona||[];const cards=data.stcards||[];const list=tab==='st'?cards:docs;const tabsHtml=`<div class="tabs"><div class="tab${tab==='doc'?' on':''}" data-switch-tab="doc"><div class="t-ico">${svg('i-persona')}</div><div class="t-name">纸页</div><div class="t-num">${docs.length}</div></div><div class="tab${tab==='st'?' on':''}" data-switch-tab="st"><div class="t-ico">${svg('i-plugin')}</div><div class="t-name">卡片</div><div class="t-num">${cards.length}</div></div></div>`;let bodyHtml='';if(tab==='doc'){bodyHtml=docs.length?docs.map(it=>`<div class="item" data-open-item="persona:${it.id}"><div class="info"><h4>${esc(it.title||'未命名')}</h4><p>${esc(preview('persona',it))}</p></div><div class="mini"><div class="mini-btn" data-del-item="persona:${it.id}">${svg('i-del')}</div></div></div>`).join(''):'<div class="empty">还没有内容</div>';bodyHtml+=`<div class="card add" data-new-item="persona">＋ 新建</div><div class="card add" data-import-item="persona">导入文件</div>`}else{bodyHtml=list.length?list.map(it=>`<div class="card-item" data-open-card="${it.id}"><img src="${esc(it.img)}"><div class="c-info"><h4>${esc(it.name||'未命名')}</h4><p>${esc((it.intro||'').replace(/\n/g,' ').slice(0,40)||'（无简介）')}</p></div><div class="mini"><div class="mini-btn" data-del-card="${it.id}">${svg('i-del')}</div></div></div>`).join(''):'<div class="empty">还没有卡片</div>';bodyHtml+=`<div class="card add" data-import-card>＋ 导入 PNG</div>`}return`<div class="head"><div class="back" data-back="home">${svg('i-back')}</div><h2>人设馆</h2></div>${tabsHtml}<div class="list">${bodyHtml}</div>`}
function viewCard(){const it=(data.stcards||[]).find(x=>x.id===view.itemId);if(!it)return'<div class="empty">卡片不存在</div>';return`<div class="head"><div class="back" data-back="list">${svg('i-back')}</div><h2>卡片</h2><div class="act"><button class="btn" data-export-card="${it.id}">导出</button><button class="btn danger" data-del-card2="${it.id}">删除</button></div></div><div class="card-view"><img class="big" src="${esc(it.img)}"><div class="cname">${esc(it.name||'未命名')}</div><div class="intro-box"><div class="intro-head" data-toggle-intro><span class="name">简介</span><span class="arrow">▼</span></div><div class="intro-body">${esc(it.intro||'（无简介）')}</div></div></div>`}
function renderFontList(){const list=settings.fonts||[];if(!list.length&&!settings.fontUrl)return'<p style="font-size:12px;color:var(--sub)">当前：默认字体</p>';let h='<p style="font-size:12px;color:var(--sub);margin:0 0 8px">已保存字体（点击切换）</p>';if(settings.fontUrl)h+=`<div class="font-row${settings.fontCurrent===-2?' on':''}" data-pick-font="-2"><span>链接字体</span><span style="flex:1"></span>${settings.fontCurrent===-2?'✓':''}</div>`;list.forEach((f,i)=>{h+=`<div class="font-row${settings.fontCurrent===i?' on':''}" data-pick-font="${i}"><span>${esc(f.name)}</span><span style="flex:1"></span>${settings.fontCurrent===i?'✓':''}<button class="font-del" data-del-font="${i}" style="margin-left:8px">删除</button></div>`});return h}
function renderBmSet(){let h='';Object.entries(CATS).forEach(([k,m])=>{const b=bmOf(k);const folded=(settings.bmFold&&settings.bmFold[k])?' folded':'';h+=`<div class="bm-set${folded}"><div class="bm-set-head" data-toggle-bm="${k}"><span class="bm-set-name">${m.name}</span><span class="bm-set-arrow">▼</span></div><div class="bm-set-body"><div class="bm-modes"><label class="${b.mode==='default'?'on':''}" data-bm-mode="${k}:default">默认</label><label class="${b.mode==='icon'?'on':''}" data-bm-mode="${k}:icon">图标</label><label class="${b.mode==='fill'?'on':''}" data-bm-mode="${k}:fill">铺满</label></div><div class="bm-img-row">${b.img?`<img class="bm-img-preview" src="${esc(b.img)}">`:''}<button class="btn" data-bm-upload="${k}">上传图片</button>${b.img?`<button class="btn danger" data-bm-del="${k}">删除</button>`:''}</div></div></div>`});return h}
function viewSettings(){const c=settings.theme||'#b8a3e8';const tc=settings.textColor||'#333333';const tic=settings.titleColor||'#4a4058';return`<div class="head"><div class="back" data-back="home">${svg('i-back')}</div><h2>设置</h2></div><div class="form"><div class="field"><div class="field-head"><span class="name">API 地址（OpenAI 兼容，带 /v1）</span></div><div class="field-body"><input class="input" data-set="apiBase" value="${esc(settings.apiBase)}" placeholder="https://xxx.com/v1"></div></div><div class="field"><div class="field-head"><span class="name">API 密钥</span></div><div class="field-body"><input class="input" data-set="apiKey" value="${esc(settings.apiKey)}" placeholder="sk-xxxx"></div></div><div class="field"><div class="field-head"><span class="name">模型</span></div><div class="field-body"><div class="setting-row"><input class="input" data-set="model" value="${esc(settings.model)}" placeholder="例如 gpt-4o-mini"><button class="btn" data-fetch-model>拉取模型</button></div><div id="model-list"></div></div></div><div class="field"><div class="field-head"><span class="name">主题颜色</span></div><div class="field-body"><div class="setting-row"><input type="color" class="theme-swatch" id="theme-color" value="${esc(c)}" style="background:${esc(c)}"><input class="input" id="theme-hex" value="${esc(c)}" placeholder="#b8a3e8"><button class="btn" data-apply-theme>应用</button></div><div style="margin-top:10px"><button class="btn ghost" data-reset-theme>恢复默认颜色</button></div></div></div><div class="field"><div class="field-head"><span class="name">文字颜色</span></div><div class="field-body"><div class="setting-row"><input type="color" class="theme-swatch" id="text-color" value="${esc(tc)}" style="background:${esc(tc)}"><input class="input" id="text-hex" value="${esc(tc)}" placeholder="#333333"><button class="btn" data-apply-text>应用</button></div><div style="margin-top:10px"><button class="btn ghost" data-reset-text>恢复默认文字色</button></div></div></div><div class="field"><div class="field-head"><span class="name">标题颜色</span></div><div class="field-body"><div class="setting-row"><input type="color" class="theme-swatch" id="title-color" value="${esc(tic)}" style="background:${esc(tic)}"><input class="input" id="title-hex" value="${esc(tic)}" placeholder="#4a4058"><button class="btn" data-apply-title>应用</button></div><div style="margin-top:10px"><button class="btn ghost" data-reset-title>恢复默认标题色</button></div></div></div><div class="field"><div class="field-head"><span class="name">自定义字体</span></div><div class="field-body"><div class="setting-row"><button class="btn" data-upload-font>上传字体文件</button><button class="btn ghost" data-reset-font>恢复默认</button></div><input class="input" data-set="fontUrl" value="${esc(settings.fontUrl)}" placeholder="或粘贴字体链接 (.ttf/.otf/.woff)" style="margin-top:10px"><div style="margin-top:12px">${renderFontList()}</div></div></div><div class="field"><div class="field-head"><span class="name">首页封面</span></div><div class="field-body">${settings.cover?`<img src="${esc(settings.cover)}" style="width:100%;max-width:200px;border-radius:12px;display:block;margin-bottom:10px">`:''}<div class="setting-row"><button class="btn" data-upload-cover>${settings.cover?'更换封面':'上传封面'}</button>${settings.cover?`<button class="btn danger" data-del-cover>删除</button>`:''}</div></div></div><div class="field"><div class="field-head"><span class="name">书签设置（点击展开）</span></div><div class="field-body">${renderBmSet()}</div></div><div class="row-btns"><button class="btn primary" data-save-settings>保存设置</button></div></div>`}function viewEdit(){const k=view.category,m=CATS[k],it=(data[k]||[]).find(x=>x.id===view.itemId);if(!it)return'<div class="empty">内容不存在</div>';return`<div class="head"><div class="back" data-back="list">${svg('i-back')}</div><h2>${m.name}</h2><div class="act"><button class="btn danger" data-del-this>删除</button></div></div><div class="form">${fields(k,it)}</div>`}
function transBoxHtml(key){const st=transState[key];if(!st||st.status==='idle')return'';const arrow=transFold?'▶':'▼';const head=`<div class="tlabel" data-toggle-trans>翻译结果 <span style="flex:1"></span><span style="font-size:11px">${arrow}</span></div>`;if(transFold)return`<div class="transbox">${head}</div>`;if(st.status==='loading')return`<div class="transbox">${head}<div class="tcontent muted">翻译中…</div></div>`;if(st.status==='error')return`<div class="transbox">${head}<div class="tcontent err">${esc(st.msg)}</div></div>`;return`<div class="transbox">${head}<div class="btnbar"><button class="b" data-copy-trans="${key}">复制</button></div><div class="tcontent">${esc(st.text)}</div></div>`}
function fieldCard(name,key,val,opts){opts=opts||{};const folded=opts.folded?' folded':'';const tall=opts.tall?' tall':'';return`<div class="field${folded}"><div class="field-head" data-toggle-field="${key}"><span class="name">${esc(name)}</span><span class="arrow">▼</span></div><div class="field-body"><textarea class="area${tall}" data-f="${key}" placeholder="${esc(opts.placeholder||name)}">${esc(val||'')}</textarea><div class="btnbar"><button class="b" data-trans-f="${key}">翻译</button><button class="b" data-copy-f="${key}">复制</button>${opts.deletable?`<button class="b danger" data-del-field="${key}">删除</button>`:''}</div>${transBoxHtml(key)}</div></div>`}
function readFieldCard(name,key,val){return`<div class="field"><div class="field-head"><span class="name">${esc(name)}</span></div><div class="field-body"><textarea class="area locked" readonly>${esc(val||'')}</textarea><div class="btnbar"><button class="b" data-trans-f="${key}">翻译</button><button class="b" data-copy-f="${key}">复制</button></div>${transBoxHtml(key)}</div></div>`}

return''}
let aiModalKey='';
function openAiModal(key){aiModalKey=key;const m=document.getElementById('ai-modal');const t=document.getElementById('ai-modal-title');const d=document.getElementById('ai-modal-desc');const inp=document.getElementById('ai-modal-input');const p=document.getElementById('ai-progress');if(t)t.textContent=key==='__persona__'?'AI 拆分人设':'AI 整理格式';if(d)d.textContent=key==='__persona__'?'AI 会把完整原文拆成多个字段，直接确定即可':'输入你想改成什么格式，比如：改成「名称-链接」';if(inp)inp.value=key==='__persona__'?'请拆分为：简介 / 经历 / 相处模式 / 用语习惯等字段':'';if(p)p.classList.remove('show');if(m)m.classList.add('show')}
function closeAiModal(){const m=document.getElementById('ai-modal');if(m)m.classList.remove('show');aiModalKey=''}
async function runAiModal(){const inp=document.getElementById('ai-modal-input');const instruction=inp?inp.value.trim():'';if(!instruction){toast('请输入指令');return}const bar=document.getElementById('ai-bar');const pct=document.getElementById('ai-pct');const msg=document.getElementById('ai-msg');const box=document.getElementById('ai-progress');if(box)box.classList.add('show');if(bar)bar.style.width='0%';if(pct)pct.textContent='0%';if(msg)msg.textContent='AI 识别中…';let prog=0;const timer=setInterval(()=>{prog=Math.min(prog+Math.random()*8+4,92);if(bar)bar.style.width=prog+'%';if(pct)pct.textContent=Math.round(prog)+'%'},220);
const o=(data[view.category]||[]).find(x=>x.id===view.itemId);if(!o){clearInterval(timer);toast('条目不存在');closeAiModal();return}try{
let result='';
if(aiModalKey==='__persona__'){const src=o.raw||'';if(!src.trim())throw new Error('完整原文为空');const fields=await aiSplitPersona(src);if(!fields.length)throw new Error('未识别出字段');o.fields=fields;result=fields.map(f=>f.name+'：\n'+f.value).join('\n\n')}
else{const src=o.content||'';if(!src.trim())throw new Error('内容为空');result=await aiFormatText(src,instruction)}
if(!o.aiResults)o.aiResults=[];o.aiResults.push({text:result,folded:false});
clearInterval(timer);if(bar)bar.style.width='100%';if(pct)pct.textContent='100%';if(msg)msg.textContent='完成';setTimeout(()=>{save();closeAiModal();render();toast('完成')},400)
}catch(err){clearInterval(timer);if(pct)pct.textContent='失败';if(msg)msg.textContent='生成失败';toast('生成失败：'+(err.message||'未知错误'));setTimeout(()=>{closeAiModal();render()},1200)}}

$('[data-copy-ai]').forEach(e=>e.onclick=()=>{const[key,idx]=e.dataset.copyAi.split(':');const o=it();const arr=o.aiResults||[];const st=arr[+idx];if(st&&st.text)copyText(st.text,e)});
$('[data-del-ai]').forEach(e=>e.onclick=()=>{const[key,idx]=e.dataset.delAi.split(':');const o=it();if(o.aiResults)o.aiResults.splice(+idx,1);save();render()});
$('[data-toggle-ai]').forEach(e=>e.onclick=()=>{const[key,idx]=e.dataset.toggleAi.split(':');const o=it();if(o.aiResults&&o.aiResults[+idx]){o.aiResults[+idx].folded=!o.aiResults[+idx].folded;save();render()}});
const tc=document.getElementById('theme-color');const th=document.getElementById('theme-hex');
if(tc)tc.oninput=()=>{settings.theme=tc.value;if(th)th.value=tc.value;applyTheme();saveSettings();render()};
if(th)th.oninput=()=>{if(/^#[0-9a-fA-F]{6}$/.test(th.value)){settings.theme=th.value;applyTheme();saveSettings()}};
$('[data-apply-theme]').forEach(e=>e.onclick=()=>{const hex=document.getElementById('theme-hex');if(!hex)return;if(!/^#[0-9a-fA-F]{6}$/.test(hex.value)){toast('格式应为 #xxxxxx');return}settings.theme=hex.value;applyTheme();saveSettings();render();toast('已应用')});
$('[data-reset-theme]').forEach(e=>e.onclick=()=>{settings.theme='';applyTheme();saveSettings();render();toast('已恢复默认颜色')});
const txc=document.getElementById('text-color');const txh=document.getElementById('text-hex');
if(txc)txc.oninput=()=>{settings.textColor=txc.value;if(txh)txh.value=txc.value;applyTheme();saveSettings();render()};
if(txh)txh.oninput=()=>{if(/^#[0-9a-fA-F]{6}$/.test(txh.value)){settings.textColor=txh.value;applyTheme();saveSettings()}};
$('[data-apply-text]').forEach(e=>e.onclick=()=>{const h=document.getElementById('text-hex');if(!h)return;if(!/^#[0-9a-fA-F]{6}$/.test(h.value)){toast('格式应为 #xxxxxx');return}settings.textColor=h.value;applyTheme();saveSettings();render();toast('已应用')});
$('[data-reset-text]').forEach(e=>e.onclick=()=>{settings.textColor='';applyTheme();saveSettings();render();toast('已恢复默认文字色')});
const tic=document.getElementById('title-color');const tih=document.getElementById('title-hex');
if(tic)tic.oninput=()=>{settings.titleColor=tic.value;if(tih)tih.value=tic.value;applyTheme();saveSettings();render()};
if(tih)tih.oninput=()=>{if(/^#[0-9a-fA-F]{6}$/.test(tih.value)){settings.titleColor=tih.value;applyTheme();saveSettings()}};
$('[data-apply-title]').forEach(e=>e.onclick=()=>{const h=document.getElementById('title-hex');if(!h)return;if(!/^#[0-9a-fA-F]{6}$/.test(h.value)){toast('格式应为 #xxxxxx');return}settings.titleColor=h.value;applyTheme();saveSettings();render();toast('已应用')});
$('[data-reset-title]').forEach(e=>e.onclick=()=>{settings.titleColor='';applyTheme();saveSettings();render();toast('已恢复默认标题色')});
}
boot().then(()=>render());
</script></body></html>
